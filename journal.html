<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scion — Journal de bord</title>
<script>
// Le Journal reprend le thème choisi dans le Codex (même réglage, même site), dès l'ouverture.
try {
  var savedTheme = localStorage.getItem('codexScionTheme');
  if (savedTheme && /^(medievale|psychedelique|olympe|titan|neon-urbain)$/.test(savedTheme)) document.documentElement.setAttribute('data-theme', savedTheme);
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Bungee&family=Marcellus&family=Metal+Mania&family=Monoton&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Mêmes jetons et même mise en page « Grimoire » que le Codex :
   titres dans la police du thème, texte courant en sérif, commandes en sans-sérif.
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #14121a;
  --panel-raised: #262232;
  --parchment: #ece3ce;
  --gold: #96832f;
  --gold-bright: #bfa84f;
  --danger: #c65f72;
  --frame: #6b5a36;
  --frame-soft: #3d3524;
  --page: #1a1720;
  --ink-soft: #cfc6e0;
  --glow-a: rgba(198,161,91,0.08);
  --glow-b: rgba(166,72,90,0.07);
  --font-display: 'Fraunces', serif;
  --font-text: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'Work Sans', sans-serif;
}
:root[data-theme="medievale"] {
  --bg: #1c140d; --panel-raised: #3a2a1a; --parchment: #ecdfc0;
  --gold: #b8860b; --gold-bright: #d4a017; --danger: #d4737d;
  --frame: #6b4f30; --frame-soft: #4a3620; --page: #2b1f14; --ink-soft: #b8a179;
  --glow-a: rgba(184,134,11,0.10); --glow-b: rgba(122,31,43,0.09);
  --font-display: 'Cinzel', 'Fraunces', serif;
}
:root[data-theme="psychedelique"] {
  --bg: #170026; --panel-raised: #3d1470; --parchment: #f5eeff;
  --gold: #ff8c00; --gold-bright: #ffc93c; --danger: #ff6ec7;
  --frame: #ff2fb0; --frame-soft: #7a2bd6; --page: #2c0a4d; --ink-soft: #d3a6ff;
  --glow-a: rgba(255,140,0,0.30); --glow-b: rgba(255,30,142,0.28);
  --font-display: 'Bungee', 'Fraunces', serif;
}
:root[data-theme="olympe"] {
  --bg: #0f1a2e; --panel-raised: #24365a; --parchment: #f0e8d8;
  --gold: #c9a544; --gold-bright: #e8c869; --danger: #e07560;
  --frame: #8a6d3b; --frame-soft: #5c4a2a; --page: #1a2740; --ink-soft: #b8ab8f;
  --glow-a: rgba(201,165,68,0.10); --glow-b: rgba(90,133,119,0.08);
  --font-display: 'Marcellus', 'Fraunces', serif;
}
:root[data-theme="titan"] {
  --bg: #0d0806; --panel-raised: #2a1c18; --parchment: #e8ddd5;
  --gold: #d4560f; --gold-bright: #f0813a; --danger: #e0525f;
  --frame: #8a3a1e; --frame-soft: #5c2814; --page: #1c1210; --ink-soft: #a89286;
  --glow-a: rgba(212,86,15,0.14); --glow-b: rgba(138,21,32,0.12);
  --font-display: 'Metal Mania', 'Fraunces', serif;
}
:root[data-theme="neon-urbain"] {
  --bg: #0a0a12; --panel-raised: #1c1c2c; --parchment: #e8ecf5;
  --gold: #ff2e88; --gold-bright: #ff6bb0; --danger: #ff4569;
  --frame: #2de2e6; --frame-soft: #1a8a8f; --page: #14141f; --ink-soft: #8f9ab5;
  --glow-a: rgba(255,46,136,0.14); --glow-b: rgba(45,226,230,0.12);
  --font-display: 'Monoton', 'Fraunces', serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--parchment); font-family: var(--font-body); min-height: 100vh; }
body {
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, var(--glow-a), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, var(--glow-b), transparent 55%);
  background-attachment: fixed;
}
::selection { background: var(--gold); color: #14121a; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.01em; margin: 0; }
p { margin: 0; }
button, input, textarea, select { font-family: var(--font-body); }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

/* ---------- Commandes ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 16px; border: 1px solid var(--frame); border-radius: 4px;
  background: transparent; color: var(--parchment); font-size: 14px; text-decoration: none;
  transition: border-color .15s ease, color .15s ease, transform .1s ease;
}
.btn:hover { border-color: var(--gold-bright); color: var(--gold-bright); }
.btn:active { transform: translateY(1px); }
.btn-gold { border-color: var(--gold-bright); color: var(--gold-bright); }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-danger:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,255,255,0.05); }
.btn-ghost { border-color: transparent; color: var(--ink-soft); }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: default; }

label, .field-label { display: block; font-family: var(--font-text); font-size: 14.5px; font-variant: small-caps; letter-spacing: 0.1em; color: var(--ink-soft); margin-bottom: 5px; }
.field { margin-bottom: 16px; min-width: 0; }
input[type="text"], input[type="search"], input[type="number"], textarea, select {
  width: 100%; background: var(--bg); color: var(--parchment); border: 1px solid var(--frame);
  border-radius: 4px; padding: 10px 12px; outline: none; font-size: 14.5px; transition: border-color .15s ease;
}
input[type="text"], input[type="search"], input[type="number"], select { height: 44px; padding-top: 0; padding-bottom: 0; }
textarea { min-height: 130px; resize: vertical; font-family: var(--font-text); font-size: 16.5px; line-height: 1.55; }
input::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: 0.7; font-style: italic; }
input:focus, textarea:focus, select:focus { border-color: var(--gold-bright); }
select {
  appearance: none; -webkit-appearance: none; padding-right: 30px; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23c6a24b' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat; background-position: right 11px center;
}
select option { background: var(--panel-raised); color: var(--parchment); }
input[type="file"] { width: 100%; font-size: 13.5px; color: var(--ink-soft); }
input[type="file"]::file-selector-button {
  font: inherit; margin-right: 12px; min-height: 36px; padding: 0 12px; border: 1px solid var(--frame);
  border-radius: 4px; background: transparent; color: var(--parchment); cursor: pointer;
}
.md-hint { font-family: var(--font-text); font-style: italic; font-size: 14.5px; color: var(--ink-soft); margin: -8px 0 16px; }
.session-row { display: flex; gap: 14px; flex-wrap: wrap; }
.session-row .field { flex: 1 1 200px; }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.error-text { color: var(--danger); font-size: 14px; }
.entry-form > .error-text { margin-bottom: 12px; }
.error-text:empty, .image-manager-note:empty { display: none; }
.muted { font-family: var(--font-text); font-style: italic; font-size: 16.5px; color: var(--ink-soft); text-align: center; padding: 26px 10px; }

/* ---------- Page ---------- */
.wrap { max-width: 800px; margin: 0 auto; padding: 34px 20px 72px; }
#screen-gate { max-width: 480px; margin: 110px auto; padding: 0 20px; text-align: center; }
#screen-gate .muted { padding: 0 0 16px; }

/* Double filet, comme le livre du Codex : bordure intérieure + contour décalé. */
.page {
  margin: 9px; padding: 30px 36px 32px;
  background: var(--page); border: 1px solid var(--frame-soft);
  outline: 1px solid var(--frame); outline-offset: 8px;
}

/* ---------- Page de titre ---------- */
#masthead { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; margin-bottom: 26px; }
.masthead-rule { width: 100%; display: flex; align-items: center; gap: 18px; margin-bottom: 4px; }
.masthead-rule span { flex: 1; height: 1px; background: var(--frame); }
.masthead-rule svg { flex: none; stroke: var(--gold-bright); }
#masthead h1 { font-size: clamp(36px, 7vw, 54px); line-height: 1.05; font-weight: 500; color: var(--parchment); }
#masthead h1 span { font-weight: 600; color: var(--gold-bright); }
:root:not([data-theme]) #masthead h1 { font-style: italic; }
:root:not([data-theme]) #masthead h1 span { font-style: normal; }
.masthead-sub { font-family: var(--font-text); font-style: italic; font-size: 17px; color: var(--ink-soft); overflow-wrap: anywhere; }
.masthead-actions { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }

.theme-picker { position: relative; }
.theme-picker-panel {
  display: none; position: absolute; top: calc(100% + 8px); right: 0; text-align: left;
  background: var(--panel-raised); border: 1px solid var(--frame); border-radius: 4px;
  padding: 6px; min-width: 190px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.theme-picker-panel.show { display: flex; flex-direction: column; gap: 2px; }
.theme-picker-option {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: transparent; border: none; color: var(--parchment); font-size: 14px; text-align: left; padding: 9px 10px; border-radius: 3px;
}
.theme-picker-option:hover { background: rgba(198,161,91,0.12); }
.theme-picker-option .check { color: var(--gold-bright); visibility: hidden; }
.theme-picker-option.active .check { visibility: visible; }

/* ---------- Écrire ---------- */
.composer { margin-bottom: 26px; }
.composer > summary { display: flex; list-style: none; width: fit-content; margin: 0 auto; cursor: pointer; }
.composer > summary::-webkit-details-marker { display: none; }
.composer .when-open, .composer[open] .when-closed { display: none; }
.composer[open] .when-open { display: inline; }
.composer[open] > summary { margin-bottom: 20px; border-color: transparent; color: var(--ink-soft); min-height: 34px; font-size: 13px; }
.page-over { font-family: var(--font-text); font-size: 15px; font-weight: 500; font-variant: small-caps; letter-spacing: 0.14em; color: var(--ink-soft); text-align: center; margin-bottom: 18px; }
.draft-note { font-family: var(--font-text); font-style: italic; font-size: 15px; color: var(--gold-bright); text-align: center; margin: -8px 0 16px; }
.draft-note button { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Recherche ---------- */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
.search-wrap { position: relative; flex: 1 1 240px; min-width: 180px; }
.search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--gold-bright); }
.search-wrap input { padding-left: 40px; background: var(--page); }
.toolbar select { flex: 0 1 200px; min-width: 150px; background-color: var(--page); }
.list-count { font-family: var(--font-text); font-style: italic; font-size: 15.5px; color: var(--ink-soft); margin-left: auto; }

/* ---------- Articles ---------- */
.entry { margin-bottom: 44px; font-family: var(--font-text); font-size: 17px; line-height: 1.6; animation: fadein .18s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.entry-head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; margin-bottom: 22px; }
.entry-over { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 8px; font-size: 15px; font-variant: small-caps; letter-spacing: 0.13em; color: var(--ink-soft); }
.entry-over span + span::before { content: "·"; margin-right: 8px; color: var(--frame); }
.entry-over .mark-new { color: var(--gold-bright); font-weight: 600; }
.entry-over .mark-gm { color: var(--danger); font-weight: 600; }
.entry-title { color: var(--gold-bright); line-height: 1.08; overflow-wrap: anywhere; }
.entry-title-xl { font-size: clamp(34px, 6.4vw, 52px); }
.entry-title-l { font-size: clamp(29px, 5vw, 40px); }
.entry-title-m { font-size: clamp(25px, 4vw, 32px); }
.entry-title.untitled { font-family: var(--font-text); font-style: italic; font-weight: 500; font-size: 24px; color: var(--ink-soft); }
.entry-byline { font-style: italic; font-size: 16.5px; color: var(--ink-soft); }
.entry-ornament { margin-top: 6px; max-width: 100%; }
.entry-ornament .orn-line { stroke: var(--frame); }
.entry-ornament .orn-gem { stroke: var(--gold-bright); }
.entry-body { white-space: pre-wrap; overflow-wrap: anywhere; }
.entry-body.dropcap::first-letter {
  float: left; font-family: var(--font-display); font-size: 3.5em; line-height: 0.82; font-weight: 600;
  padding: 5px 9px 0 0; color: var(--gold-bright);
}
.entry-notice { margin-top: 14px; padding: 10px 14px; border: 1px solid var(--danger); border-radius: 3px; color: var(--danger); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.entry-images { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
.entry-images.single { grid-template-columns: minmax(0, 1fr); }
.thumb { display: block; padding: 0; border: 1px solid var(--frame-soft); border-radius: 3px; background: var(--bg); overflow: hidden; cursor: zoom-in; }
.thumb img { width: 100%; height: 230px; object-fit: cover; display: block; }
.entry-images.single .thumb img { height: auto; max-height: 460px; }
.entry-actions { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm-bar { margin-top: 20px; display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; font-family: var(--font-body); font-size: 14px; }
.comment .confirm-bar { margin-top: 6px; }
.entry.editing .entry-view { display: none; }
.entry-edit { animation: fadein .16s ease; }

/* ---------- Commentaires ---------- */
.comments { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--frame-soft); }
.comments-head { font-family: var(--font-text); font-size: 15px; font-weight: 600; font-variant: small-caps; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 6px; }
.comment { padding: 10px 0 12px; border-bottom: 1px dotted var(--frame-soft); font-size: 16px; line-height: 1.5; }
.comment-new { box-shadow: inset 2px 0 0 var(--gold-bright); padding-left: 12px; }
.comment-meta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
.comment-author { font-variant: small-caps; letter-spacing: 0.08em; font-weight: 600; font-size: 15.5px; }
.comment-date { font-style: italic; font-size: 14.5px; color: var(--ink-soft); }
.comment-delete { margin-left: auto; min-height: 28px; padding: 0 8px; }
.comment-body { white-space: pre-wrap; overflow-wrap: anywhere; }
.comment-form { display: flex; gap: 8px; margin-top: 14px; align-items: flex-end; }
.comment-form textarea { min-height: 44px; height: 44px; flex: 1; font-size: 15.5px; padding: 9px 12px; }
.comment-error { margin-top: 6px; }

/* ---------- Images du formulaire ---------- */
.image-manager-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.image-manager-grid:empty { display: none; }
.image-chip { position: relative; width: 84px; height: 84px; border-radius: 3px; overflow: hidden; border: 1px solid var(--frame); flex-shrink: 0; }
.image-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.image-chip-remove {
  position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: rgba(10,9,14,0.8); color: #ece3ce; border: none; font-size: 11px;
  display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1;
}
.image-manager-url-row { display: flex; gap: 8px; margin-top: 8px; }
.image-manager-url-row input { flex: 1; min-width: 0; }
.image-manager-url-row .btn { min-height: 44px; }
.image-manager-note { font-family: var(--font-text); font-style: italic; font-size: 14.5px; color: var(--ink-soft); margin-top: 6px; }
.image-manager-note.error-text { font-family: var(--font-body); font-style: normal; font-size: 14px; color: var(--danger); }

.lightbox { position: fixed; inset: 0; background: rgba(10,9,14,0.93); display: flex; align-items: center; justify-content: center; z-index: 999; cursor: zoom-out; padding: 24px; border: 0; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 3px; }

@media (max-width: 640px) {
  .wrap { padding: 22px 12px 48px; }
  .page { margin: 6px; padding: 22px 16px 24px; outline-offset: 5px; }
  .entry { font-size: 16.5px; margin-bottom: 34px; }
  .toolbar select { flex: 1 1 150px; }
  .list-count { flex: 1 1 100%; text-align: right; }
  .thumb img { height: 150px; }
  .comment-form { flex-wrap: wrap; }
  .comment-form textarea { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { .entry, .entry-edit { animation: none; } }
</style>
</head>
<body>

<div id="screen-gate">
  <div class="page">
    <p id="gate-message" class="muted">Chargement…</p>
    <a href="index.html" class="btn btn-sm">← Retour à l'accueil</a>
  </div>
</div>

<div id="journal-app" class="wrap" style="display:none;">
  <header id="masthead">
    <div class="masthead-rule" aria-hidden="true">
      <span></span>
      <svg width="34" height="14" viewBox="0 0 34 14" fill="none" stroke-width="1.2"><path d="M17 1 L23 7 L17 13 L11 7 Z"/><path d="M1 7 H9 M25 7 H33"/></svg>
      <span></span>
    </div>
    <h1>Journal <span>de bord</span></h1>
    <p class="masthead-sub" id="journal-sub"></p>
    <div class="masthead-actions">
      <a id="back-link" href="index.html" class="btn">🗂 Table</a>
      <div class="theme-picker">
        <button type="button" class="btn" id="theme-picker-btn" aria-haspopup="true">Thème ▾</button>
        <div class="theme-picker-panel" id="theme-picker-panel">
          <button type="button" class="theme-picker-option" data-theme="classique"><span>Classique</span><span class="check">✓</span></button>
          <button type="button" class="theme-picker-option" data-theme="medievale"><span>Médiévale</span><span class="check">✓</span></button>
          <button type="button" class="theme-picker-option" data-theme="psychedelique"><span>Psychédélique</span><span class="check">✓</span></button>
          <button type="button" class="theme-picker-option" data-theme="olympe"><span>Olympe</span><span class="check">✓</span></button>
          <button type="button" class="theme-picker-option" data-theme="titan"><span>Titan</span><span class="check">✓</span></button>
          <button type="button" class="theme-picker-option" data-theme="neon-urbain"><span>Néon Urbain</span><span class="check">✓</span></button>
        </div>
      </div>
    </div>
  </header>

  <details id="composer" class="composer">
    <summary class="btn btn-gold"><span class="when-closed">✒ Écrire un article</span><span class="when-open">✕ Refermer</span></summary>
    <div class="page">
      <h2 class="page-over">Nouvel article</h2>
      <p id="draft-note" class="draft-note" hidden></p>
      <div id="composer-slot"></div>
    </div>
  </details>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="search" placeholder="Rechercher dans les articles…" aria-label="Rechercher dans les articles" autocomplete="off">
    </div>
    <select id="session-filter" aria-label="Filtrer par séance"><option value="">Toutes les séances</option></select>
    <span id="list-count" class="list-count"></span>
  </div>
  <div id="entries-list"></div>
</div>

<script type="module">
// Version figée de la bibliothèque Supabase (la même que la Fiche : un seul téléchargement pour les deux pages).
const SUPABASE_LIB_URL = 'https://esm.sh/@supabase/supabase-js@2.119.0';
const SUPABASE_URL = 'https://nlskjszxwipbgosxvjkq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sc2tqc3p4d2lwYmdvc3h2amtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODE0NjEsImV4cCI6MjEwNDM1NzQ2MX0.VFjq8YaaCpVG8OK4DY9lDJw0JkQtBeOoEZhPeCbpz0c';

const MAX_IMAGES = 4;
const THEME_KEY = 'codexScionTheme'; // réglage partagé avec le Codex
const ORNAMENT = '<svg class="entry-ornament" aria-hidden="true" width="150" height="14" viewBox="0 0 150 14" fill="none" stroke-width="1.2">' +
  '<path class="orn-line" d="M0 7 H62 M88 7 H150"/><path class="orn-gem" d="M75 1 L81 7 L75 13 L69 7 Z"/></svg>';

let supabase = null;
var currentUser = null;
var currentTable = null;
var memberNames = {};       // user_id -> pseudo, pour cette table
var myCharacters = [];      // [{id, name}] — mes personnages sur cette table
var allEntries = [];        // tous les articles de la table (avec leurs commentaires)
var previousVisitMs = null; // date de la visite précédente, pour les mentions « Nouveau »
var cards = new Map();      // id d'article -> sa carte déjà construite (réutilisée d'un filtrage à l'autre)
var composer = null;        // formulaire « Nouvel article » en cours
var formSeq = 0;

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function button(cls, text) { var b = el('button', cls, text); b.type = 'button'; return b; }

var dateFmt = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function fmtDate(iso) { try { return dateFmt.format(new Date(iso)); } catch (e) { return iso; } }
function nameOf(userId) { return memberNames[userId] || 'Joueur inconnu'; }
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function isSinceLastVisit(iso) { return previousVisitMs !== null && new Date(iso).getTime() > previousVisitMs; }
function parseSession(raw) { var n = parseInt(String(raw).trim(), 10); return n >= 1 ? n : null; }
// Message lisible quand la base ne modifie aucune ligne (droits insuffisants, article déjà supprimé…).
function dbMessage(error) { return error.code === 'PGRST116' ? 'la base a refusé la modification' : (error.message || 'erreur serveur'); }

// Mise en forme minimale et sûre : échappe d'abord tout le HTML, puis n'autorise
// que **gras** et *italique*. Les retours à la ligne sont gérés par white-space:pre-wrap.
function renderRichText(raw) {
  var escaped = escapeHtml(raw);
  escaped = escaped.replace(/\*\*([^\*]+?)\*\*/g, '<strong>$1</strong>');
  escaped = escaped.replace(/\*([^\*]+?)\*/g, '<em>$1</em>');
  return escaped;
}

function showGate(msg) {
  $('gate-message').textContent = msg;
  $('screen-gate').style.display = '';
  $('journal-app').style.display = 'none';
}

/* ============ Thème ============ */
function applyTheme(theme) {
  if (theme === 'classique') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-picker-option').forEach(function (b) { b.classList.toggle('active', b.dataset.theme === theme); });
}
function wireThemePicker() {
  var panel = $('theme-picker-panel');
  applyTheme(document.documentElement.getAttribute('data-theme') || 'classique');
  $('theme-picker-btn').addEventListener('click', function () { panel.classList.toggle('show'); });
  document.querySelectorAll('.theme-picker-option').forEach(function (b) {
    b.addEventListener('click', function () {
      applyTheme(b.dataset.theme);
      try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) {}
      panel.classList.remove('show');
    });
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.theme-picker')) panel.classList.remove('show'); });
}

/* ============ Confirmation sur place (remplace les fenêtres du navigateur) ============
   « host » est masqué le temps de la question, posée juste après « anchor ».
   « action » renvoie un message d'erreur à afficher, ou rien si tout s'est bien passé. */
function askConfirm(host, anchor, message, yesLabel, action) {
  var bar = el('div', 'confirm-bar');
  var yes = button('btn btn-sm btn-danger', yesLabel);
  var no = button('btn btn-sm btn-ghost', 'Annuler');
  var err = el('span', 'error-text');
  err.setAttribute('role', 'alert');
  bar.append(el('span', null, message), yes, no, err);
  host.hidden = true;
  anchor.after(bar);
  no.focus();
  function close() { bar.remove(); host.hidden = false; }
  no.addEventListener('click', close);
  yes.addEventListener('click', async function () {
    yes.disabled = no.disabled = true;
    err.textContent = '';
    var problem;
    try { problem = await action(); } catch (e) { problem = 'Erreur : ' + e.message; }
    if (problem) { err.textContent = problem; yes.disabled = no.disabled = false; return; }
    if (bar.isConnected) close();
  });
}

function openLightbox(src) {
  var overlay = button('lightbox');
  overlay.setAttribute('aria-label', "Fermer l'image");
  var img = el('img');
  img.src = src; img.alt = '';
  overlay.appendChild(img);
  var opener = document.activeElement;
  function close() { overlay.remove(); document.removeEventListener('keydown', onKey); if (opener && opener.focus) opener.focus(); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  overlay.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(overlay);
  overlay.focus();
}

/* ============ Gestionnaire d'images (jusqu'à 4, fichier ou lien URL) ============
   initialImages : liste déjà enregistrée, sous la forme [{url, source: 'upload'|'link'}, ...]. */
function createImageManager(initialImages) {
  var items = (initialImages || []).map(function (im) { return { kind: 'existing', url: im.url, source: im.source }; });
  var container = el('div');
  var grid = el('div', 'image-manager-grid');
  var addRow = el('div', 'image-manager-add');
  container.append(grid, addRow);

  function render() {
    grid.textContent = '';
    items.forEach(function (item, idx) {
      var chip = el('div', 'image-chip');
      var img = el('img');
      img.src = item.kind === 'file' ? item.previewUrl : item.url;
      img.alt = '';
      var rm = button('image-chip-remove', '✕');
      rm.title = 'Retirer cette image';
      rm.setAttribute('aria-label', 'Retirer cette image');
      rm.addEventListener('click', function () {
        if (item.kind === 'file' && item.previewUrl) URL.revokeObjectURL(item.previewUrl);
        items.splice(idx, 1);
        render();
      });
      chip.append(img, rm);
      grid.appendChild(chip);
    });
    renderAddRow();
  }

  function renderAddRow() {
    addRow.textContent = '';
    if (items.length >= MAX_IMAGES) {
      addRow.appendChild(el('p', 'image-manager-note', 'Maximum de ' + MAX_IMAGES + ' images atteint.'));
      return;
    }
    var fileInput = el('input');
    fileInput.type = 'file'; fileInput.accept = 'image/*';
    fileInput.setAttribute('aria-label', 'Ajouter une image depuis un fichier');
    fileInput.addEventListener('change', function () {
      var f = fileInput.files[0];
      if (!f) return;
      items.push({ kind: 'file', file: f, previewUrl: URL.createObjectURL(f) });
      render();
    });

    var urlRow = el('div', 'image-manager-url-row');
    var urlInput = el('input');
    urlInput.type = 'text'; urlInput.placeholder = 'ou colle un lien URL vers une image…';
    urlInput.setAttribute('aria-label', "Lien vers une image");
    var urlBtn = button('btn btn-sm', 'Ajouter');
    var note = el('p', 'image-manager-note error-text');
    function addLink() {
      var v = urlInput.value.trim();
      if (!v) return;
      if (!/^https?:\/\//i.test(v)) { note.textContent = 'Le lien doit commencer par http:// ou https://'; return; }
      items.push({ kind: 'link', url: v });
      render();
    }
    urlBtn.addEventListener('click', addLink);
    urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addLink(); } });
    urlInput.addEventListener('input', function () { note.textContent = ''; });
    urlRow.append(urlInput, urlBtn);
    addRow.append(fileInput, urlRow, note);
  }

  render();
  return {
    el: container,
    getItems: function () { return items; },
    dispose: function () { items.forEach(function (it) { if (it.kind === 'file' && it.previewUrl) URL.revokeObjectURL(it.previewUrl); }); }
  };
}

// Envoie les fichiers en attente et renvoie la liste finale pour la colonne « images ».
// Une image qui échoue n'empêche pas d'enregistrer le reste : elle est signalée dans « failures ».
async function resolveImageManager(manager, entryId) {
  var items = manager.getItems();
  var images = [], uploadedNow = [], failures = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.kind === 'existing') images.push({ url: it.url, source: it.source });
    else if (it.kind === 'link') images.push({ url: it.url, source: 'link' });
    else {
      var up = await uploadEntryImage(entryId, it.file);
      if (up.url) { images.push({ url: up.url, source: 'upload' }); uploadedNow.push(up.url); }
      else failures.push('« ' + it.file.name + ' » : ' + up.error);
    }
  }
  return { images: images, uploadedNow: uploadedNow, failures: failures };
}

// Images envoyées qui étaient là avant la modification et n'y sont plus : à effacer du stockage.
function removedUploadedImages(initialImages, finalImages) {
  var keptUrls = finalImages.map(function (im) { return im.url; });
  return (initialImages || []).filter(function (im) { return im.source === 'upload' && keptUrls.indexOf(im.url) === -1; });
}

// Redimensionne côté navigateur (bord le plus long à 1600px, ré-encodée en JPEG qualité 0.82)
// avant l'envoi, pour que les photos prises au téléphone ne saturent pas le stockage gratuit.
function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 1600;
  quality = quality || 0.82;
  return new Promise(function (resolve) {
    var objectUrl = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      URL.revokeObjectURL(objectUrl);
      canvas.toBlob(function (blob) { resolve(blob || file); }, 'image/jpeg', quality);
    };
    img.onerror = function () { URL.revokeObjectURL(objectUrl); resolve(file); };
    img.src = objectUrl;
  });
}

async function uploadEntryImage(entryId, file) {
  try {
    var blob = await compressImage(file);
    var path = currentTable.id + '/' + entryId + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
    var up = await supabase.storage.from('journal-images').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) return { error: up.error.message };
    var pub = supabase.storage.from('journal-images').getPublicUrl(path);
    var url = pub.data && pub.data.publicUrl;
    return url ? { url: url } : { error: "adresse de l'image introuvable" };
  } catch (e) { return { error: e.message }; }
}

// Au mieux : retire une image du stockage lors d'un remplacement ou d'une suppression.
// N'agit que sur les images envoyées — les liens externes n'ont rien à effacer ici.
async function removeStoredImage(url) {
  try {
    var marker = '/journal-images/';
    var idx = url.indexOf(marker);
    if (idx === -1) return;
    await supabase.storage.from('journal-images').remove([url.substring(idx + marker.length)]);
  } catch (e) {}
}

/* ============ Formulaire d'article (le même pour « Nouvel article » et « Modifier ») ============ */
function fillSignatureOptions(select, selected) {
  select.textContent = '';
  var pseudo = el('option', null, (memberNames[currentUser.id] || 'Joueur') + ' (pseudo)');
  pseudo.value = '';
  select.appendChild(pseudo);
  var names = myCharacters.map(function (c) { return c.name; });
  // Signature d'un personnage renommé ou supprimé depuis : on la garde proposée, pour ne pas la perdre en modifiant l'article.
  if (selected && names.indexOf(selected) === -1) names.push(selected);
  names.forEach(function (name) {
    var o = el('option', null, name);
    o.value = name;
    select.appendChild(o);
  });
  select.value = selected || '';
}

function buildEntryForm(opts) {
  var entry = opts.entry || null;
  var n = ++formSeq;
  var form = el('div', 'entry-form');
  function field(labelText, control, key) {
    var f = el('div', 'field');
    var l = el('label', null, labelText);
    control.id = 'f' + n + '-' + key;
    l.htmlFor = control.id;
    f.append(l, control);
    return f;
  }
  var title = el('input'); title.type = 'text'; title.placeholder = "Titre de l'article (optionnel)";
  var body = el('textarea'); body.placeholder = 'Raconte…';
  var session = el('input'); session.type = 'number'; session.min = '1'; session.step = '1'; session.placeholder = 'ex. 12';
  var signed = el('select');
  fillSignatureOptions(signed, entry ? entry.signed_as : null);
  if (entry) {
    title.value = entry.title || '';
    body.value = entry.body || '';
    session.value = entry.session_number != null ? entry.session_number : '';
  }
  var row = el('div', 'session-row');
  row.append(field('Numéro de séance (optionnel)', session, 'session'), field('Signer en tant que', signed, 'signed'));
  var initialImages = entry ? (entry.images || []) : [];
  var manager = createImageManager(initialImages);
  var imgField = el('div', 'field');
  imgField.append(el('div', 'field-label', "Images (jusqu'à " + MAX_IMAGES + ' — fichier ou lien)'), manager.el);
  var error = el('div', 'error-text');
  error.setAttribute('role', 'alert');
  var actions = el('div', 'form-actions');
  var submit = button('btn btn-gold', opts.submitLabel);
  actions.appendChild(submit);
  if (opts.onCancel) {
    var cancel = button('btn btn-ghost', 'Annuler');
    cancel.addEventListener('click', function () { manager.dispose(); opts.onCancel(); });
    actions.appendChild(cancel);
  }
  form.append(field('Titre', title, 'title'), field('Texte', body, 'body'), el('p', 'md-hint', 'Tu peux utiliser **gras** et *italique*.'), row, imgField, error, actions);

  submit.addEventListener('click', async function () {
    error.textContent = '';
    var bodyV = body.value.trim();
    if (!bodyV) { error.textContent = entry ? 'Le texte ne peut pas être vide.' : 'Écris quelque chose avant de publier.'; return; }
    var values = { title: title.value.trim(), body: bodyV, session_number: parseSession(session.value), signed_as: signed.value || null };
    submit.disabled = true;
    try {
      var saved, up;
      if (entry) {
        up = await resolveImageManager(manager, entry.id);
        var upd = await supabase.from('journal_entries')
          .update(Object.assign({}, values, { images: up.images, updated_at: new Date().toISOString() }))
          .eq('id', entry.id).select().single();
        if (upd.error) {
          up.uploadedNow.forEach(removeStoredImage); // rien n'a été enregistré : on ne laisse pas d'images orphelines
          throw new Error(dbMessage(upd.error));
        }
        removedUploadedImages(initialImages, up.images).forEach(function (im) { removeStoredImage(im.url); });
        saved = upd.data;
      } else {
        var ins = await supabase.from('journal_entries')
          .insert(Object.assign({ table_id: currentTable.id, author_id: currentUser.id }, values)).select().single();
        if (ins.error) throw new Error(ins.error.message);
        saved = ins.data;
        up = await resolveImageManager(manager, saved.id);
        if (up.images.length) {
          var withImages = await supabase.from('journal_entries').update({ images: up.images }).eq('id', saved.id).select().single();
          if (withImages.error) {
            up.uploadedNow.forEach(removeStoredImage);
            up.failures = ["les images n'ont pas pu être rattachées à l'article (" + dbMessage(withImages.error) + ')'];
          } else saved = withImages.data;
        }
      }
      manager.dispose();
      opts.onSaved(saved, up.failures);
    } catch (e) {
      error.textContent = 'Erreur : ' + e.message;
      submit.disabled = false;
    }
  });

  return { el: form, title: title, body: body, session: session, signed: signed };
}

/* ============ Nouvel article + brouillon ============
   Ce qui est tapé dans « Nouvel article » est gardé dans ce navigateur tant que ce n'est pas publié :
   une fermeture d'onglet ou un rechargement ne fait plus perdre le texte. */
function draftKey() { return 'scionJournal:draft:' + currentTable.id; }
function readDraft() { try { return JSON.parse(localStorage.getItem(draftKey()) || 'null'); } catch (e) { return null; } }
function clearDraft() { clearTimeout(draftTimer); try { localStorage.removeItem(draftKey()); } catch (e) {} $('draft-note').hidden = true; }

function mountComposer() {
  composer = buildEntryForm({
    submitLabel: 'Publier',
    onSaved: function (saved, failures) {
      saved.journal_comments = [];
      if (failures.length) saved._notice = noticeText(failures);
      allEntries.unshift(saved);
      clearDraft();
      mountComposer();
      $('composer').open = false;
      refreshList();
    }
  });
  var slot = $('composer-slot');
  slot.textContent = '';
  slot.appendChild(composer.el);

  [composer.title, composer.body, composer.session, composer.signed].forEach(function (c) {
    c.addEventListener('input', function () { clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 400); });
  });
}

var draftTimer = null;
function saveDraft() {
  if (!composer) return;
  var d = { title: composer.title.value, body: composer.body.value, session: composer.session.value, signed: composer.signed.value, t: new Date().toISOString() };
  try {
    if (d.title.trim() || d.body.trim()) localStorage.setItem(draftKey(), JSON.stringify(d));
    else localStorage.removeItem(draftKey());
  } catch (e) {}
}

function restoreDraft() {
  var d = readDraft();
  if (!d || !(d.title || d.body)) return;
  composer.title.value = d.title || '';
  composer.body.value = d.body || '';
  composer.session.value = d.session || '';
  if (d.signed && Array.prototype.some.call(composer.signed.options, function (o) { return o.value === d.signed; })) composer.signed.value = d.signed;
  var note = $('draft-note');
  note.textContent = 'Brouillon retrouvé' + (d.t ? ' du ' + fmtDate(d.t) : '') + ' — ';
  var drop = button(null, "l'effacer");
  drop.addEventListener('click', function () { clearDraft(); mountComposer(); });
  note.appendChild(drop);
  note.hidden = false;
  $('composer').open = true;
}

function noticeText(failures) {
  return (failures.length > 1 ? 'Des images n\'ont pas pu être enregistrées' : 'Une image n\'a pas pu être enregistrée') +
    ' — ' + failures.join(' ; ') + '. Tu peux réessayer avec « Modifier ».';
}

/* ============ Chargement ============ */
function fetchEntries() {
  return supabase
    .from('journal_entries')
    .select('*, journal_comments(*)')
    .eq('table_id', currentTable.id)
    .order('created_at', { ascending: false })
    .order('created_at', { foreignTable: 'journal_comments', ascending: true });
}

function showEntries(res) {
  var list = $('entries-list');
  if (res.error) {
    list.textContent = '';
    var p = el('p', 'muted error-text', 'Les articles n\'ont pas pu être chargés (' + res.error.message + '). ');
    var retry = button('btn btn-sm', 'Réessayer');
    retry.addEventListener('click', async function () {
      retry.disabled = true;
      var again;
      try { again = await fetchEntries(); } catch (e) { again = { error: { message: e.message } }; }
      showEntries(again);
    });
    p.appendChild(retry);
    list.appendChild(p);
    $('list-count').textContent = '';
    return;
  }
  allEntries = res.data || [];
  cards.clear();
  refreshList();
}

async function init() {
  wireThemePicker();
  var code = new URLSearchParams(window.location.search).get('table');
  if (!code) { showGate('Aucune table indiquée. Reviens à l\'accueil.'); return; }

  try {
    var lib = await import(SUPABASE_LIB_URL);
    supabase = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    showGate('Impossible de charger la connexion à la plateforme. Vérifie ta connexion internet, puis recharge la page.');
    return;
  }

  var memberRes, charRes, entriesRes;
  try {
    var sessionRes = await supabase.auth.getSession();
    var session = sessionRes.data && sessionRes.data.session;
    if (!session) { showGate('Tu dois être connecté pour accéder au journal.'); return; }
    currentUser = session.user;

    var tableRes = await supabase.from('tables').select('*').eq('code', code).maybeSingle();
    if (tableRes.error || !tableRes.data) { showGate('Cette table est introuvable.'); return; }
    currentTable = tableRes.data;

    // Les trois lectures suivantes ne dépendent que de la table : elles partent en même temps.
    var results = await Promise.all([
      supabase.from('table_members').select('user_id, display_name').eq('table_id', currentTable.id),
      supabase.from('characters').select('id, name').eq('table_id', currentTable.id).eq('owner_id', currentUser.id).order('created_at'),
      fetchEntries()
    ]);
    memberRes = results[0]; charRes = results[1]; entriesRes = results[2];
  } catch (e) {
    showGate('La plateforme ne répond pas pour le moment. Vérifie ta connexion internet, puis recharge la page.');
    return;
  }

  if (memberRes.error) { showGate('Erreur : ' + memberRes.error.message); return; }
  var mine = false;
  (memberRes.data || []).forEach(function (m) {
    memberNames[m.user_id] = m.display_name;
    if (m.user_id === currentUser.id) mine = true;
  });
  if (!mine) { showGate("Tu n'es pas membre de cette table."); return; }
  myCharacters = charRes.data || [];

  var visitKey = 'scionJournal:lastVisit:' + currentTable.id;
  try {
    var prev = localStorage.getItem(visitKey);
    var prevMs = prev ? new Date(prev).getTime() : NaN;
    previousVisitMs = isNaN(prevMs) ? null : prevMs;
  } catch (e) { previousVisitMs = null; }

  document.title = 'Journal de bord — ' + currentTable.name;
  $('journal-sub').textContent = currentTable.name;
  $('back-link').href = 'index.html?table=' + encodeURIComponent(currentTable.code);
  $('screen-gate').style.display = 'none';
  $('journal-app').style.display = '';

  mountComposer();
  restoreDraft();
  window.addEventListener('pagehide', saveDraft);
  $('search-input').addEventListener('input', applyFilters);
  $('session-filter').addEventListener('change', applyFilters);
  showEntries(entriesRes);
  if (!entriesRes.error) { try { localStorage.setItem(visitKey, new Date().toISOString()); } catch (e) {} }
}

/* ============ Liste et filtres ============ */
function refreshList() { populateSessionFilter(); applyFilters(); }

function populateSessionFilter() {
  var sel = $('session-filter');
  var current = sel.value;
  var sessions = Array.from(new Set(
    allEntries.map(function (e) { return e.session_number; }).filter(function (v) { return v !== null && v !== undefined; })
  ));
  sessions.sort(function (a, b) { return b - a; });
  sel.textContent = '';
  var all = el('option', null, 'Toutes les séances'); all.value = '';
  sel.appendChild(all);
  sessions.forEach(function (s) { var o = el('option', null, 'Séance ' + s); o.value = String(s); sel.appendChild(o); });
  if (sessions.indexOf(Number(current)) !== -1) sel.value = current;
}

function getFilteredEntries() {
  var q = $('search-input').value.trim().toLowerCase();
  var sessionFilter = $('session-filter').value;
  return allEntries.filter(function (e) {
    if (sessionFilter !== '' && String(e.session_number || '') !== sessionFilter) return false;
    if (!q) return true;
    var hay = ((e.title || '') + ' ' + e.body + ' ' + (e.signed_as || '')).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}

// Les cartes déjà construites sont réutilisées telles quelles : filtrer ou chercher ne fait perdre
// ni un commentaire en cours de frappe, ni un formulaire de modification ouvert.
function applyFilters() {
  var entries = getFilteredEntries();
  var list = $('entries-list');
  var total = allEntries.length;
  $('list-count').textContent = !total ? '' :
    entries.length === total ? total + (total > 1 ? ' articles' : ' article') : entries.length + ' sur ' + total;
  if (!entries.length) {
    list.textContent = '';
    list.appendChild(el('p', 'muted', total ? 'Aucun article ne correspond à ce filtre.' : "Aucun article pour le moment — sois le premier à écrire quelque chose."));
    return;
  }
  list.replaceChildren.apply(list, entries.map(function (entry) {
    if (!cards.has(entry.id)) cards.set(entry.id, renderEntryCard(entry));
    return cards.get(entry.id);
  }));
}

function refreshCard(entry) {
  var old = cards.get(entry.id);
  var fresh = renderEntryCard(entry);
  cards.set(entry.id, fresh);
  if (old && old.parentNode) old.parentNode.replaceChild(fresh, old);
}

/* ============ Carte d'article ============ */
function renderEntryCard(entry) {
  var mine = entry.author_id === currentUser.id;
  var isGm = currentTable.created_by === entry.author_id;
  var newCommentsCount = (entry.journal_comments || []).filter(function (c) {
    return c.author_id !== currentUser.id && isSinceLastVisit(c.created_at);
  }).length;

  var card = el('article', 'page entry');
  var view = el('div', 'entry-view');

  var head = el('header', 'entry-head');
  var over = el('div', 'entry-over');
  if (entry.session_number != null) over.appendChild(el('span', null, 'Séance ' + entry.session_number));
  if (isGm) over.appendChild(el('span', 'mark-gm', 'MJ'));
  if (!mine && isSinceLastVisit(entry.created_at)) over.appendChild(el('span', 'mark-new', 'Nouveau'));
  if (newCommentsCount > 0) over.appendChild(el('span', 'mark-new', newCommentsCount + (newCommentsCount > 1 ? ' nouveaux commentaires' : ' nouveau commentaire')));
  if (over.childNodes.length) head.appendChild(over);

  var titleText = entry.title || '';
  var titleEl = el('h2', 'entry-title', titleText || '(Sans titre)');
  titleEl.classList.add(!titleText ? 'untitled' : titleText.length <= 24 ? 'entry-title-xl' : titleText.length <= 48 ? 'entry-title-l' : 'entry-title-m');
  head.appendChild(titleEl);

  var signature = entry.signed_as ? entry.signed_as + ' (' + nameOf(entry.author_id) + ')' : nameOf(entry.author_id);
  var edited = entry.updated_at && entry.updated_at !== entry.created_at;
  head.appendChild(el('p', 'entry-byline', signature + ' — ' + fmtDate(entry.created_at) + (edited ? ' (modifié)' : '')));
  head.insertAdjacentHTML('beforeend', ORNAMENT);
  view.appendChild(head);

  var bodyEl = el('div', 'entry-body');
  bodyEl.innerHTML = renderRichText(entry.body);
  var raw = entry.body || '';
  // Lettrine : seulement sur un premier paragraphe assez long pour la porter.
  if (raw.length >= 260 && /^[A-Za-zÀ-ÖØ-öø-ÿŒœ]/.test(raw) && raw.slice(0, 200).indexOf('\n') === -1) bodyEl.classList.add('dropcap');
  view.appendChild(bodyEl);

  if (entry._notice) { view.appendChild(el('p', 'entry-notice', entry._notice)); delete entry._notice; }

  var images = entry.images || [];
  if (images.length) {
    var imagesWrap = el('div', 'entry-images' + (images.length === 1 ? ' single' : ''));
    images.forEach(function (im, i) {
      var thumb = button('thumb');
      thumb.setAttribute('aria-label', "Agrandir l'image " + (i + 1));
      var img = el('img');
      img.loading = 'lazy'; img.decoding = 'async';
      img.src = im.url; img.alt = '';
      thumb.appendChild(img);
      thumb.addEventListener('click', function () { openLightbox(im.url); });
      imagesWrap.appendChild(thumb);
    });
    view.appendChild(imagesWrap);
  }

  if (mine) {
    var actions = el('div', 'entry-actions');
    var editBtn = button('btn btn-sm', 'Modifier');
    editBtn.addEventListener('click', function () { openEditForm(card, entry); });
    var delBtn = button('btn btn-sm btn-ghost', '🗑 Supprimer');
    delBtn.addEventListener('click', function () {
      askConfirm(actions, actions, 'Supprimer définitivement cet article et ses commentaires ?', 'Supprimer', async function () {
        var res = await supabase.from('journal_entries').delete().eq('id', entry.id).select('id');
        if (res.error) return 'Erreur : ' + res.error.message;
        if (!res.data || !res.data.length) return 'Erreur : la base a refusé la suppression.';
        images.filter(function (im) { return im.source === 'upload'; }).forEach(function (im) { removeStoredImage(im.url); });
        allEntries = allEntries.filter(function (e) { return e !== entry; });
        cards.delete(entry.id);
        refreshList();
      });
    });
    actions.append(editBtn, delBtn);
    view.appendChild(actions);
  }

  card.append(view, renderComments(entry));
  return card;
}

// Le formulaire prend la place de l'article le temps de la modification (un seul à la fois par article).
function openEditForm(card, entry) {
  if (card.classList.contains('editing')) return;
  var wrap = el('div', 'entry-edit');
  wrap.appendChild(el('h2', 'page-over', "Modifier l'article"));
  function close() { wrap.remove(); card.classList.remove('editing'); }
  var form = buildEntryForm({
    entry: entry,
    submitLabel: 'Enregistrer',
    onCancel: close,
    onSaved: function (saved, failures) {
      Object.assign(entry, saved); // la ligne renvoyée par la base ; les commentaires déjà chargés sont conservés
      if (failures.length) entry._notice = noticeText(failures);
      refreshCard(entry);
      refreshList();
    }
  });
  wrap.appendChild(form.el);
  card.classList.add('editing');
  card.insertBefore(wrap, card.querySelector('.comments'));
  form.title.focus();
}

/* ============ Commentaires ============ */
function renderComments(entry, draftText) {
  var list = entry.journal_comments || [];
  var wrap = el('section', 'comments');
  wrap.appendChild(el('h3', 'comments-head', list.length ? 'Commentaires · ' + list.length : 'Commentaires'));

  list.forEach(function (c) {
    var isNew = c.author_id !== currentUser.id && isSinceLastVisit(c.created_at);
    var cEl = el('div', 'comment' + (isNew ? ' comment-new' : ''));
    var meta = el('div', 'comment-meta');
    meta.append(el('span', 'comment-author', nameOf(c.author_id)), el('span', 'comment-date', fmtDate(c.created_at)));
    var cBody = el('div', 'comment-body');
    cBody.innerHTML = renderRichText(c.body);
    cEl.append(meta, cBody);

    if (c.author_id === currentUser.id) {
      var delBtn = button('btn btn-sm btn-ghost comment-delete', '🗑');
      delBtn.title = 'Supprimer ce commentaire';
      delBtn.setAttribute('aria-label', 'Supprimer ce commentaire');
      delBtn.addEventListener('click', function () {
        askConfirm(delBtn, cBody, 'Supprimer ce commentaire ?', 'Supprimer', async function () {
          var res = await supabase.from('journal_comments').delete().eq('id', c.id).select('id');
          if (res.error) return 'Erreur : ' + res.error.message;
          if (!res.data || !res.data.length) return 'Erreur : la base a refusé la suppression.';
          entry.journal_comments = list.filter(function (x) { return x !== c; });
          refreshComments(entry);
        });
      });
      meta.appendChild(delBtn);
    }
    wrap.appendChild(cEl);
  });

  var form = el('div', 'comment-form');
  var ta = el('textarea');
  ta.placeholder = 'Ajouter un commentaire…';
  ta.setAttribute('aria-label', 'Ajouter un commentaire');
  ta.value = draftText || '';
  var send = button('btn btn-sm', 'Envoyer');
  send.title = 'Envoyer (Ctrl + Entrée)';
  var err = el('div', 'error-text comment-error');
  err.setAttribute('role', 'alert');
  async function submit() {
    var text = ta.value.trim();
    if (!text || send.disabled) return;
    send.disabled = true;
    err.textContent = '';
    try {
      var res = await supabase.from('journal_comments').insert({ entry_id: entry.id, author_id: currentUser.id, body: text }).select().single();
      if (res.error) throw new Error(res.error.message);
      entry.journal_comments = (entry.journal_comments || []).concat([res.data]);
      refreshComments(entry, true);
    } catch (e) {
      err.textContent = 'Erreur : ' + e.message;
      send.disabled = false;
    }
  }
  send.addEventListener('click', submit);
  ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); } });
  form.append(ta, send);
  wrap.append(form, err);
  return wrap;
}

// Ne reconstruit que les commentaires de l'article concerné (pas toute la page).
function refreshComments(entry, clearDraftText) {
  var card = cards.get(entry.id);
  if (!card) return;
  var old = card.querySelector('.comments');
  var typed = clearDraftText ? '' : old.querySelector('.comment-form textarea').value;
  card.replaceChild(renderComments(entry, typed), old);
}

init();
</script>
